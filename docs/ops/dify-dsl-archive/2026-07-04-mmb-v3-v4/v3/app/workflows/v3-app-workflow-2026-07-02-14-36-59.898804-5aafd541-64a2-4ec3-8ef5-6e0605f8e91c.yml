        query_attachment_selector: []
        query_variable_selector:
        - rewrite_001
        - text
        retrieval_mode: multiple
        selected: false
        single_retrieval_config:
          model:
            completion_params:
              frequency_penalty: 0
              max_tokens: 512
              presence_penalty: 0
              temperature: 0
              top_p: 1
            mode: chat
            name: gpt-5.5
            provider: langgenius/openai_api_compatible/openai_api_compatible
        title: 知识检索
        type: knowledge-retrieval
      height: 117
      id: retrieve_001
      position:
        x: 958.75
        y: 250
      positionAbsolute:
        x: 958.75
        y: 250
