    - data:
        answer: '{{#answer_llm_001.text#}}'
        desc: 输出最终回答。
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 130
      id: answer_001
      position:
        x: 1600
        y: 250
      positionAbsolute:
        x: 1600
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "\ndef main(query: str, class_id: str, results: list) -> dict:\n   \
          \ import re\n\n    query = query or \"\"\n    class_id = class_id or \"\"\
          \n    results = results or []\n    image_terms = (\"图片\", \"图\", \"logo\"\
          , \"Logo\", \"海报\", \"发给我\", \"看下\", \"长什么样\", \"配图\", \"熊是什么样\")\n    image_intent\
          \ = class_id == \"image_show\" or any(term in query for term in image_terms)\n\
          \    business_terms = (\"合作\", \"战略\", \"深圳文交所\", \"深圳文化产权交易所\", \"加盟\"\
          , \"投资\", \"融资\", \"团队\", \"创始\", \"负责人\", \"方案\", \"模式\", \"分润\", \"费用\"\
          , \"收益\")\n\n    def content_of(item):\n        if not isinstance(item,\
          \ dict):\n            return str(item or \"\")\n        return str(item.get(\"\
          content\") or item.get(\"text\") or \"\")\n\n    def title_of(item):\n \
          \       if not isinstance(item, dict):\n            return \"\"\n      \
          \  meta = item.get(\"metadata\") or {}\n        return str(item.get(\"title\"\
          ) or meta.get(\"document_name\") or \"\")\n\n    def compact_len(text):\n\
          \        return len(re.sub(r\"\\s+\", \"\", text or \"\"))\n\n    def chunk_type(item):\n\
          \        text = content_of(item)\n        title = title_of(item)\n     \
          \   lower = (text + \"\\n\" + title).lower()\n        if \"<!-- chunk_type:\
          \ ocr_noise -->\" in lower:\n            return \"ocr_noise\"\n        if\
          \ \"<!-- chunk_type: business_fact -->\" in lower:\n            return \"\
          business_fact\"\n        if \"<!-- chunk_type: table_fact -->\" in lower:\n\
          \            return \"table_fact\"\n        if \"<!-- chunk_type: visual_asset\
          \ -->\" in lower:\n            return \"visual_asset\"\n        if \"logo\"\
          \ in lower and compact_len(text) <= 80:\n            return \"ocr_noise\"\
          \n        if re.search(r\"#\\s*ocr\\s*文字\\s*[-：:\\n\\s]*mmb\\s*$\", text,\
          \ re.I) or text.strip() in {\"MMB\", \"- MMB\", \"# OCR文字\\n- MMB\"}:\n\
          \            return \"ocr_noise\"\n        if \"# 品牌/主体/场景元素\" in text or\
          \ \"# 检索关键词\" in text or \"# 入库标签\" in text:\n            return \"visual_asset\"\
          \n        if compact_len(text) <= 12 and \"mmb\" in lower:\n           \
          \ return \"ocr_noise\"\n        return \"text\"\n\n    def relevant_to_business(text):\n\
          \        haystack = (query + \"\\n\" + text).lower()\n        return any(term.lower()\
          \ in haystack for term in business_terms)\n\n    kept = []\n    filtered\
          \ = []\n    for idx, item in enumerate(results):\n        text = content_of(item).strip()\n\
          \        if not text:\n            continue\n        ctype = chunk_type(item)\n\
          \        if ctype == \"ocr_noise\":\n            filtered.append({\"index\"\
          : idx, \"chunk_type\": ctype, \"title\": title_of(item)})\n            continue\n\
          \        if not image_intent and ctype == \"visual_asset\" and not relevant_to_business(text):\n\
          \            filtered.append({\"index\": idx, \"chunk_type\": ctype, \"\
          title\": title_of(item)})\n            continue\n        rank = {\"business_fact\"\
          : 0, \"table_fact\": 1, \"text\": 2, \"visual_asset\": 3}.get(ctype, 2)\n\
          \        if image_intent and ctype == \"visual_asset\":\n            rank\
          \ = 0\n        kept.append((rank, idx, ctype, title_of(item), text))\n\n\
          \    kept.sort(key=lambda row: (row[0], row[1]))\n    if not kept:\n   \
          \     for idx, item in enumerate(results[:5]):\n            text = content_of(item).strip()\n\
          \            if text and chunk_type(item) != \"ocr_noise\":\n          \
          \      kept.append((5, idx, chunk_type(item), title_of(item), text))\n\n\
          \    blocks = []\n    for _, idx, ctype, title, text in kept[:8]:\n    \
          \    blocks.append(f\"[chunk_type: {ctype}]\\n[来源: {title}]\\n{text}\")\n\
          \n    return {\n        \"context\": \"\\n\\n---\\n\\n\".join(blocks),\n\
          \        \"kept_count\": len(kept[:8]),\n        \"filtered_count\": len(filtered),\n\
          \    }\n"
        code_language: python3
        desc: 过滤低信息 OCR/Logo 片段，按业务/视觉意图组织上下文。
        outputs:
          context:
            children: null
            type: string
          filtered_count:
            children: null
            type: number
          kept_count:
            children: null
            type: number
        selected: false
        title: 检索后过滤
        type: code
        variables:
        - value_selector:
          - rewrite_001
          - text
          variable: query
        - value_selector:
          - classify_001
          - class_id
          variable: class_id
        - value_selector:
          - retrieve_001
          - result
          variable: results
      height: 83
      id: filter_001
      position:
        x: 1120
        y: 250
      positionAbsolute:
        x: 1120
        y: 250
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 143.19999999999982
      y: 196.5
      zoom: 0.8000000000000002
  rag_pipeline_variables: []
