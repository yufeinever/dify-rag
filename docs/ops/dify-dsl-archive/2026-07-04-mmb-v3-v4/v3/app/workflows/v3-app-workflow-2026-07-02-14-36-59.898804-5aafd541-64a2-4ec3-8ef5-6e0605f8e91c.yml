        dataset_ids:
        - tn5vfd77JyWe2Zg5w2hEcYo55AzE4WidK8GurNQANGa4C4oswTlA371FyaHFvg5w
        desc: 基于用户原始问题检索 V3 PDF 增强知识库。核心事实段已内置业务问法触发词。
        multiple_retrieval_config:
