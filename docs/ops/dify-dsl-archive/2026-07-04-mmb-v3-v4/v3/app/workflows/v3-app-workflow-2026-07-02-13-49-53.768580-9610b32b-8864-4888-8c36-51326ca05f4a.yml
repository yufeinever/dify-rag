      zIndex: 0
    - data:
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
      id: retrieve_001-source-answer_llm_001-target
      source: retrieve_001
      sourceHandle: source
      target: answer_llm_001
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: answer_llm_001-source-answer_001-target
      source: answer_llm_001
      sourceHandle: source
      target: answer_001
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 用户问题入口。
        selected: false
        title: 开始
        type: start
        variables: []
      height: 100
      id: start_001
      position:
        x: 0
        y: 260
      positionAbsolute:
        x: 0
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 结合多轮上下文，把追问改写成完整检索问题。
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 14
        model:
          completion_params:
            frequency_penalty: 0
            max_tokens: 512
            presence_penalty: 0
            temperature: 0
            top_p: 1
          mode: chat
          name: gpt-5.5
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 5e6a8c2f-b36e-46b8-84d3-21704f1c02c4
          role: system
          text: 'MMB = 懵懵熊 = 瞢瞢熊 = 麦乐迪智慧鲜啤交易所，都是同一个业务主体或相关主体。

            把用户当前问题改写成适合知识库检索的独立问题，优先保留中文业务关键词。

            - 如果用户问“MMB的创始人是谁”“瞢瞢熊创始人是谁”“核心团队有哪些”，只输出：核心团队有哪些人 创始人 负责人

            - 如果是追问，结合最近对话补全指代对象。

            - 如果用户要求发图/看图，保留图片意图和对象。

            - 普通业务问题保留原问题语义，不要编造答案。

            - 只输出改写后的检索问题，不要解释。


            当前问题：{{#sys.query#}}'
        selected: true
        title: 问题改写
        type: llm
        variables: []
        vision:
          configs:
            detail: high
            variable_selector: []
          enabled: false
      height: 131
      id: rewrite_001
      position:
        x: 320
        y: 250
      positionAbsolute:
        x: 320
        y: 250
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        classes:
        - id: normal
          name: 普通知识问答
        - id: business_plan
          name: 加盟投资合作类
        - id: image_show
          name: 图片展示类
        - id: mixed
          name: 图文混合回答
        desc: 区分普通问答、加盟投资合作、图片展示和图文混合。
        instructions: 根据改写后的问题选择最合适类别。看图、发图、展示、配图、图片属于图片展示或图文混合。加盟、投资、合伙人、分润、门槛、合作模式属于加盟投资合作类。
        model:
          completion_params:
            frequency_penalty: 0
            max_tokens: 256
            presence_penalty: 0
            temperature: 0
            top_p: 1
          mode: chat
          name: gpt-5.5
          provider: langgenius/openai_api_compatible/openai_api_compatible
        query_variable_selector:
        - rewrite_001
        - text
        selected: false
        title: 意图判断
        topics: []
        type: question-classifier
      height: 305
      id: classify_001
      position:
        x: 640
        y: 235
      positionAbsolute:
        x: 640
        y: 235
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        dataset_ids:
        - tn5vfd77JyWe2Zg5w2hEcYo55AzE4WidK8GurNQANGa4C4oswTlA371FyaHFvg5w
        desc: 基于问题改写结果检索 V3 PDF 增强知识库。
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            model: bge-reranker-v2-m3
            provider: langgenius/xinference/xinference
          score_threshold: 0
          top_k: 10
        query_attachment_selector: []
        query_variable_selector:
        - rewrite_001
        - text
        retrieval_mode: multiple
        selected: false
        single_retrieval_config:
          model:
            completion_params:
              frequency_penalty: 0
              max_tokens: 512
              presence_penalty: 0
              temperature: 0
              top_p: 1
            mode: chat
            name: gpt-5.5
            provider: langgenius/openai_api_compatible/openai_api_compatible
        title: 知识检索
        type: knowledge-retrieval
      height: 117
      id: retrieve_001
      position:
        x: 958.75
        y: 250
      positionAbsolute:
        x: 958.75
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: true
          variable_selector:
          - retrieve_001
          - result
        desc: 生成结构化、可表格化、可图文说明的回答。
        memory:
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 12
        model:
          completion_params:
            frequency_penalty: 0
            max_tokens: 2048
            presence_penalty: 0
            temperature: 0.25
            top_p: 1
          mode: chat
          name: gpt-5.5
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: 5bfb829d-d017-4a52-a035-8d9f8e145d06
          role: system
          text: '角色：你是 MMB 业务知识助手。


            知识库上下文：

            {{#context#}}


            检索问题：{{#rewrite_001.text#}}

            用户原始问题：{{#sys.query#}}


            回答规则：

            - 只基于知识库上下文回答，不编造。

            - 先给直接结论，再分点说明。

            - 普通问题要给出清晰定义、业务定位、关键能力和来源文档名。

            - 加盟/投资/合作类问题必须覆盖：加入方式、适合对象、门槛/金额、收益/分润、风险或待确认事项；适合用表格时输出 Markdown 表格。

            - 如果用户要求“发图、看图、配图、图片、图文”，并且上下文中存在“原图预览路径: http...”或“原图预览路径: /files/...”，必须返回
            1-3 张最相关图片。

            - 返回图片时使用 Markdown 图片格式：![原图文件名](原图预览路径)。图片路径必须逐字复制上下文中的“原图预览路径”，不要改写、不要省略
            query 参数。

            - 图片下方用一句话说明图片内容和适合用途。

            - 不要复用 /files/tools/ 临时链接；但可以使用 /files/{id}/image-preview 链接。

            - 图文混合问题：先回答文字，再插入最相关图片。

            - 关键结论后用括号标注文档名。

            - 如果上下文确实没有依据，回答：这个问题我暂时没有把握，能否换个方式描述一下？'
        selected: false
        title: 结构化回答
        type: llm
        variables: []
        vision:
          configs:
            detail: high
            variable_selector:
            - sys
            - files
          enabled: true
      height: 131
      id: answer_llm_001
      position:
        x: 1280
        y: 250
      positionAbsolute:
        x: 1280
        y: 250
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        answer: '{{#answer_llm_001.text#}}'
        desc: 输出最终回答。
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 130
