      zIndex: 0
    - data:
        isInLoop: false
        sourceType: question-classifier
        targetType: knowledge-retrieval
      id: classify_001-image_show-retrieve_001-target
      source: classify_001
      sourceHandle: image_show
      target: retrieve_001
      targetHandle: target
