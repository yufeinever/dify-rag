app:
  description: V3 PDF增强 App：问题改写、意图判断、结构化回答，绑定 MMB统一材料知识库-v3-pdf增强。
  icon: /custom-bear-icons/06-chatbot-bear.png
  icon_background: ''
  icon_type: image
  mode: advanced-chat
  name: MMB业务助手-v3-pdf增强
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/xinference:0.0.15@1de758e19d1e6751215f0209057564c5cfd4e23ea8259d75fe33060543908b26
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.53@a0dfb462961a03c6a6415d4185043185b01017c64da93cf82a9e5ecaf59f8ed0
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 100
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '👋 你好！我是 MMB 业务助手，你可以向我了解：


      - MMB 是做什么的

      - MMB 的品牌、IP 形象和应用场景

      - MMB 与深圳文交所的合作内容

      - MMB 的加盟、投资、合作相关问题

      - 需要配图说明的品牌或项目资料'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - MMB是做什么的，配图说明
    - MMB的熊是什么样子的，发给我看下
    - 深圳文交所和MMB是什么合作
    - MMB加盟方式有哪些，用表格说明
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start_001-source-rewrite_001-target
      source: start_001
      sourceHandle: source
      target: rewrite_001
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
        sourceType: llm
        targetType: question-classifier
      id: rewrite_001-source-classify_001-target
      source: rewrite_001
      sourceHandle: source
      target: classify_001
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInLoop: false
