identity:
  name: structure-visual-document
  author: mmb
  label:
    en_US: PDF/PPT/DOC One-shot Quality Enricher
    zh_Hans: PDF/PPT/DOC 一次导入质量增强
description:
  human:
    en_US: Bind layout, tables, visual elements, headings, and noise controls before emitting quality-gated Markdown for general chunking.
    zh_Hans: 将 PDF/PPT/DOC 的版面、表格、图片、标题和噪声治理前置处理，并输出适合通用分段的一次导入增强 Markdown。
  llm: Structure MinerU Markdown/content_list into typed, self-contained, noise-controlled Markdown before General Chunker.
parameters:
- name: parsed_text
  type: string
  required: true
  label:
    en_US: Parsed Markdown
    zh_Hans: 解析 Markdown
  human_description:
    en_US: Markdown text from MMB Normalize + MinerU Parse.
    zh_Hans: 来自 MMB Normalize + MinerU Parse 的 Markdown 文本。
  llm_description: Parsed Markdown text from upstream MinerU normalization node.
  form: llm
- name: content_list
  type: string
  required: false
  label:
    en_US: MinerU Content List
    zh_Hans: MinerU 内容列表
  human_description:
    en_US: Optional JSON content list from MinerU.
    zh_Hans: 可选的 MinerU JSON 内容列表。
  llm_description: Optional MinerU content_list JSON for page/image/table context binding.
  form: llm
- name: file_metadata
  type: string
  required: false
  label:
    en_US: File Metadata
    zh_Hans: 文件元数据
  human_description:
    en_US: Optional file metadata from normalize node.
    zh_Hans: 可选的 normalize 节点文件元数据。
  llm_description: Optional source file metadata JSON.
  form: llm
output_schema:
  type: object
  properties:
    text:
      type: string
      description: Visual-aware structured Markdown for General Chunker.
    structure_report:
      type: object
      description: Structuring stats and strategy.
extra:
  python:
    source: tools/structure_visual_document.py
